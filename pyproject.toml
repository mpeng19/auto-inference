[project]
name = "auto-inference"
version = "0.1.0"
description = "Price an LLM serving stack the way a marketplace would"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
    "numpy>=2.5.2",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "huggingface-hub>=1.29.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
    "ruff>=0.16.5",
    "seaborn>=0.13.2",
]

[project.scripts]
simulate = "simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]
# The market snapshot is package data, not repo data -- see price.market.
artifacts = ["src/simulator/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py", "ops/**/*.py"]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is checked by the formatter, not the linter
    "B008",    # dataclass field defaults read better than the alternative
    "SIM108",  # a ternary is not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they mean; a lambda or a magic number in an assertion is fine.
"tests/**" = ["E731", "B011"]
