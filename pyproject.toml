[project]
name = "auto-inference"
version = "0.1.0"
description = "Harness for autonomous optimization of an LLM inference/serving system"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
