[project]
name = "auto-inference"
version = "0.1.0"
description = "Price an LLM serving stack the way a marketplace would"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "mcp>=2.1.1",
    "modal>=1.5.5",
    "numpy>=2.5.2",
    "pypdf>=6.16.2",
    "textual>=8.2.8",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "huggingface-hub>=1.29.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
    "ruff>=0.16.5",
    "seaborn>=0.13.2",
]
# Hybrid search in the harness (ideas, memory, skills): `uv sync --group
# embeddings` adds a local sentence model; without it every read is lexical.
embeddings = [
    "sentence-transformers>=3",
]

[project.scripts]
simulate = "simulator.cli:main"
harness = "harness.cli:main"
tracedb = "tracedb.cli:main"
tracedb-mcp = "tracedb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator", "src/harness", "src/tracedb"]
# Non-Python files the wheel must carry, named so a build from an untracked
# checkout still ships them: the market snapshot (see price.market) and the
# test sweep it is verified against (`pytest --pyargs simulator`), the skill
# docs an agent workspace installs (harness/skills/docs/**/SKILL.md) and the
# packaged idea seed set (harness/ideas/seeds/*.jsonl).
artifacts = ["src/simulator/data/*.json", "src/simulator/tests/data/*.json",
             "src/**/*.md", "src/**/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests live beside the code they test. Every test directory is a package
# (`__init__.py`), so pytest imports them through `simulator.*` rather than by
# path -- which is what makes `pytest <any path>` work from any directory.
testpaths = ["src/simulator", "src/harness", "src/tracedb"]

[tool.ruff]
src = ["src"]
include = ["src/**/*.py"]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is checked by the formatter, not the linter
    "B008",    # dataclass field defaults read better than the alternative
    "SIM108",  # a ternary is not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they mean; a lambda or a magic number in an assertion is fine.
"**/tests/**" = ["E731", "B011"]
"**/conftest.py" = ["E731", "B011"]
# The contracts index groups `__all__` by service rather than alphabetically:
# that grouping is the documentation of what services exist, and sorting it
# destroys the only structure the file has.
"src/harness/contracts/__init__.py" = ["RUF022"]
"src/harness/__init__.py" = ["RUF022"]
# tracedb was written elsewhere in a deliberately dense style (its whole
# point is being compact enough to read in one sitting). Reformatting 800
# lines of validated code to satisfy a whitespace rule is a bad trade; the
# substantive findings were fixed.
"src/tracedb/**" = ["E701", "E702"]
