[project]
name = "auto-inference"
version = "0.1.0"
description = "Price an LLM serving stack the way a marketplace would"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
    "numpy>=2.5.2",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "huggingface-hub>=1.29.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
simulate = "simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
